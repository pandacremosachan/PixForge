[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pixelforge"
version = "4.1.1"
description = "PixForge: shared pixel core with native C++ Windows desktop"
requires-python = ">=3.10"
dependencies = [
    "pillow>=10.0.0",
    "pydantic>=2,<3",
]

[tool.hatch.build.targets.wheel]
packages = ["pixelforge"]
