<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PixForge · 模型与形状预览</title><style>
*{box-sizing:border-box}body{margin:0;background:#10151e;color:#dce5ef;font:15px/1.6 system-ui,"Microsoft YaHei",sans-serif}main{max-width:1180px;margin:auto;padding:28px}h1{font-size:26px;margin:0}p{color:#a9b9cb}section{display:grid;grid-template-columns:minmax(360px,600px) minmax(300px,1fr);gap:24px}canvas{width:100%;background:#141b25;border:1px solid #2b3748;border-radius:12px;touch-action:none;cursor:grab}aside{background:#19212d;border:1px solid #2b3748;border-radius:12px;padding:22px}label{display:block;margin:12px 0}input[type=range]{width:100%}button,select{background:#28374b;color:#edf5ff;padding:8px 14px;border:1px solid #49607d;border-radius:6px;margin-right:7px;cursor:pointer}pre{font-size:12px;white-space:pre-wrap;overflow-wrap:anywhere;color:#9db2cb}small{color:#94a7be}.legend{display:flex;gap:16px}.legend label{display:inline-block}.readout{max-height:260px;overflow:auto}a{color:#78d7e9}@media(max-width:780px){section{display:block}aside{margin-top:16px}main{padding:14px}}
</style><main><h1 id="projectTitle">模型与形状叠加预览</h1><p>拖动模型旋转；分别查看基础形状、碰撞和选中轮廓。线框穿透显示，几何与游戏光照效果需在接入后核对。</p><section><div><canvas id="view" width="520" height="520"></canvas><div class="legend"><label style="color:#ffca68"><input id="base" type="checkbox">基础</label><label style="color:#ff678b"><input id="collision" type="checkbox" checked>碰撞</label><label style="color:#62e5ff"><input id="selection" type="checkbox">选中</label><label><input id="model" type="checkbox" checked>模型</label></div></div><aside><div><button id="play">播放</button><button id="iso">立体</button><button id="top">顶视</button><button id="front">正视</button></div><div id="stateControls" hidden><label>状态预览<select id="state"></select></label><button id="stateStart">启动</button><button id="stateStop">停机</button><button id="stateDemo">完整流程</button></div><label>模型朝向 <span id="angle"></span><input id="yaw" type="range" min="-180" max="180" value="35"></label><label>俯仰角<input id="pitch" type="range" min="-89" max="90" value="30"></label><label id="frameLabel">动画帧<input id="frame" type="range" min="0" value="0"></label><p id="mode"></p><div class="readout"><pre id="summary"></pre><pre id="boxes"></pre></div><p><small>形状坐标以 16 为一格。默认碰撞和选中继承基础形状；独立空列表表示无形状。JSON 是 PixForge 数据，原版资源包不改变碰撞；Java 适配器需要接入已注册方块。</small></p><pre id="identity"></pre></aside></section></main>
<script>
'use strict';/*SCENE_RUNTIME*/
const data=/*DATA*/null;
const $=id=>document.getElementById(id),cv=$('view'),ctx=cv.getContext('2d'),size=cv.width;
let frames=[],step=0,running=false,start=0,drag=null,sceneAt=0,lastTick=0,lastAdvance=0;
const player=SceneRuntime.isProgram(data.scene)?new SceneRuntime.Player(data.scene):null;
const sceneView=()=>player?player.view():null,sceneClip=()=>player?player.clip:data.scene,sceneDuration=()=>player?(player.sequenceMode?data.scene.duration_ms:player.clip.duration_ms):data.scene?data.scene.duration_ms:0;
const dot=(a,b)=>a.reduce((s,n,i)=>s+n*b[i],0),verts=b=>{const[x,y,z]=b.from,[X,Y,Z]=b.to;return[[x,y,z],[X,y,z],[X,Y,z],[x,Y,z],[x,y,Z],[X,y,Z],[X,Y,Z],[x,Y,Z]]};
function render(){if(!frames.length)return;const yaw=+$('yaw').value*Math.PI/180,pitch=+$('pitch').value*Math.PI/180;
const right=[Math.cos(yaw),0,-Math.sin(yaw)],up=[-Math.sin(pitch)*Math.sin(yaw),Math.cos(pitch),-Math.sin(pitch)*Math.cos(yaw)],depth=[Math.cos(pitch)*Math.sin(yaw),Math.sin(pitch),Math.cos(pitch)*Math.cos(yaw)],scale=(size-50)/(2*data.bounds.radius);
const project=p=>{const v=p.map((n,i)=>n-data.bounds.center[i]);return[size/2+dot(v,right)*scale,size/2-dot(v,up)*scale,dot(v,depth)]};
ctx.fillStyle='#141b25';ctx.fillRect(0,0,size,size);const img=ctx.getImageData(0,0,size,size),out=img.data,zbuf=new Float64Array(size*size).fill(-Infinity),tex=frames[data.plan.steps[step].frame];
if($('model').checked)for(const face of SceneRuntime.pose(data.mesh,data.scene,sceneAt,sceneView())){if(dot(face.normal,depth)<=1e-9)continue;const p=face.vertices.map(project);for(const tri of [[0,1,2],[0,2,3]]){const[a,b,c]=tri.map(i=>p[i]),[ta,tb,tc]=tri.map(i=>face.uv[i]),den=(b[1]-c[1])*(a[0]-c[0])+(c[0]-b[0])*(a[1]-c[1]);if(Math.abs(den)<1e-9)continue;
for(let y=Math.max(0,Math.floor(Math.min(a[1],b[1],c[1])));y<Math.min(size,Math.ceil(Math.max(a[1],b[1],c[1])));y++)for(let x=Math.max(0,Math.floor(Math.min(a[0],b[0],c[0])));x<Math.min(size,Math.ceil(Math.max(a[0],b[0],c[0])));x++){const u=((b[1]-c[1])*(x+.5-c[0])+(c[0]-b[0])*(y+.5-c[1]))/den,v=((c[1]-a[1])*(x+.5-c[0])+(a[0]-c[0])*(y+.5-c[1]))/den,w=1-u-v,i=y*size+x,z=u*a[2]+v*b[2]+w*c[2];if(Math.min(u,v,w)<-1e-8||z<zbuf[i]-1e-8)continue;const mod=(n,m)=>(n%m+m)%m,tx=mod(Math.floor((u*ta[0]+v*tb[0]+w*tc[0])*tex.width),tex.width),ty=mod(Math.floor((u*ta[1]+v*tb[1]+w*tc[1])*tex.height),tex.height),ti=(ty*tex.width+tx)*4,alpha=tex.data[ti+3]/255;if(!alpha)continue;for(let k=0;k<3;k++)out[i*4+k]=Math.round(tex.data[ti+k]*face.shade*alpha+out[i*4+k]*(1-alpha));zbuf[i]=z;}}}
if(data.scene)for(const p of SceneRuntime.particles(data.scene,sceneAt,sceneView()).sort((a,b)=>dot(a.position,depth)-dot(b.position,depth))){const[x,y,z]=project(p.position),half=p.size*scale/2,alpha=p.color[3]/255;if(half<=0||alpha<=0)continue;for(let iy=Math.max(0,Math.ceil(y-half-.5));iy<Math.min(size,Math.ceil(y+half-.5));iy++)for(let ix=Math.max(0,Math.ceil(x-half-.5));ix<Math.min(size,Math.ceil(x+half-.5));ix++){const index=iy*size+ix;if(z<zbuf[index]-1e-8)continue;for(let c=0;c<3;c++)out[index*4+c]=Math.max(0,Math.min(255,Math.round(p.color[c]*alpha+out[index*4+c]*(p.blend==='additive'?1:1-alpha))))}}
ctx.putImageData(img,0,0);for(const target of ['base','collision','selection'])if($(target).checked){ctx.strokeStyle=data.colors[target];ctx.lineWidth=target==='selection'?2:1;for(const box of data.shapes[target]){const pts=verts(box).map(project);ctx.beginPath();for(const[a,b]of data.edges){ctx.moveTo(...pts[a].slice(0,2));ctx.lineTo(...pts[b].slice(0,2));}ctx.stroke();}}
$('frame').value=data.scene?sceneAt:step;$('frameLabel').firstChild.textContent=`动画步骤 ${step+1} / ${data.plan.steps.length} · 源帧 ${data.plan.steps[step].frame+1} · ${data.plan.steps[step].duration_ms} ms`;if(data.scene)$('frameLabel').firstChild.textContent=`${player?player.clip.label:'场景'} ${Math.round(sceneAt)} / ${sceneDuration()} ms · 部件 ${sceneClip().transforms.length} · 发射器 ${sceneClip().emitters.length}`;if(player){$('state').value=player.state;$('frame').max=sceneDuration();const events=player.summary().available_events;$('stateStart').disabled=!events.includes('start');$('stateStop').disabled=!events.includes('stop');}$('angle').textContent=$('yaw').value+'°';}
const textureTotal=data.plan.steps.reduce((s,v)=>s+v.duration_ms,0),total=data.scene?data.scene.duration_ms:textureTotal;
function textureStep(){
 const control=data.scene?SceneRuntime.textureControl(data.scene,sceneAt,sceneView()):{mode:'play',time_ms:sceneAt};
 if(control.mode==='hold'&&control.frame!==undefined){step=Math.max(0,data.plan.steps.findIndex(s=>s.frame===control.frame));return}
 let t=control.time_ms;t=data.plan.loop?((t%textureTotal)+textureTotal)%textureTotal:Math.min(Math.max(0,t),textureTotal-1e-7);step=0;while(step<data.plan.steps.length-1&&t>=data.plan.steps[step].duration_ms)t-=data.plan.steps[step++].duration_ms;
}
function seek(n){if(player){player.seek(n);sceneAt=player.clock();textureStep();lastAdvance=performance.now();render();return}if(data.scene){sceneAt=n;start=performance.now()-n;textureStep();render();return}step=n;start=performance.now()-data.plan.steps.slice(0,step).reduce((s,v)=>s+v.duration_ms,0);render()}
function tick(now){if(running){if(player){player.advance(Math.min(120000,Math.max(0,now-lastAdvance)));lastAdvance=now;sceneAt=player.clock();textureStep();if(player.finished){running=false;$('play').textContent='播放'}if(now-lastTick>=33){lastTick=now;render()}}
 else{let t=now-start;if(data.scene?data.scene.loop:data.plan.loop)t%=total;else if(t>=total){t=total-Number.EPSILON;running=false;$('play').textContent='播放';}if(data.scene){sceneAt=t;textureStep()}else{let n=0;while(n<data.plan.steps.length-1&&t>=data.plan.steps[n].duration_ms)t-=data.plan.steps[n++].duration_ms;step=n}if(now-lastTick>=33){lastTick=now;render()}}}requestAnimationFrame(tick)}
$('play').onclick=()=>{running=!running;$('play').textContent=running?'暂停':'播放';if(player){if(player.finished)player.seek(0);lastAdvance=performance.now();sceneAt=player.clock();textureStep();render()}else seek(data.scene?sceneAt:step)};
if(player){$('stateControls').hidden=false;for(const clip of data.scene.states){const option=document.createElement('option');option.value=clip.id;option.textContent=clip.label;$('state').appendChild(option)}
 $('state').onchange=()=>{running=false;$('play').textContent='播放';player.select($('state').value);sceneAt=0;textureStep();render()};
 const action=event=>{if(event==='demo')player.beginSequence();else player.event(event);sceneAt=player.clock();textureStep();running=true;$('play').textContent='暂停';lastAdvance=performance.now();render()};
 $('stateStart').onclick=()=>action('start');$('stateStop').onclick=()=>action('stop');$('stateDemo').onclick=()=>action('demo');textureStep();
}
for(const id of ['base','collision','selection','model','yaw','pitch'])$(id).oninput=render;
$('frame').max=data.scene?total:data.plan.steps.length-1;$('frame').oninput=()=>{running=false;$('play').textContent='播放';seek(+$('frame').value)};
for(const[id,y,p]of[['iso',35,30],['top',0,90],['front',0,0]])$(id).onclick=()=>{$('yaw').value=y;$('pitch').value=p;render()};
cv.onpointerdown=e=>{drag=[e.clientX,e.clientY,+$('yaw').value,+$('pitch').value];cv.setPointerCapture(e.pointerId)};cv.onpointermove=e=>{if(!drag)return;$('yaw').value=Math.max(-180,Math.min(180,drag[2]+(e.clientX-drag[0])*.5));$('pitch').value=Math.max(-89,Math.min(90,drag[3]-(e.clientY-drag[1])*.5));render()};cv.onpointerup=()=>drag=null;
document.addEventListener('visibilitychange',()=>{if(document.hidden){running=false;$('play').textContent='播放'}});
if(data.scene){$('mode').textContent=`${data.scene.target.loader} / MC ${data.scene.target.minecraft} · 离线场景预览，尚未接入游戏`;document.querySelector('main>p').textContent='部件运动、粒子与材质共用时间轴；拖动旋转视角，拖动时间滑块逐时检查。自定义着色器尚未支持。'}else $('mode').textContent=`碰撞：${data.report.modes.collision==='inherit'?'继承基础':'独立覆盖'}；选中：${data.report.modes.selection==='inherit'?'继承基础':'独立覆盖'}`;
$('projectTitle').textContent='模型与形状 · '+(data.metadata.project_name||'未命名工程');document.title='PixForge · '+(data.metadata.project_name||'形状预览');
$('summary').textContent=JSON.stringify(data.report,null,2);$('boxes').textContent=JSON.stringify(data.shapes,null,2);$('identity').textContent=`文档 ${data.metadata.document_id}\n版本 ${data.metadata.revision}\n摘要 ${data.metadata.content_digest}\n待查看和确认`;
Promise.all(data.images.map(src=>new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=im.width;c.height=im.height;const cx=c.getContext('2d');cx.drawImage(im,0,0);resolve(cx.getImageData(0,0,im.width,im.height))};im.onerror=reject;im.src=src}))).then(result=>{frames=result;render();requestAnimationFrame(tick)}).catch(e=>{$('projectTitle').textContent='模型与形状 · '+(data.metadata.project_name||'未命名工程');document.title='PixForge · '+(data.metadata.project_name||'形状预览');
$('summary').textContent=String(e)});
</script></html>
