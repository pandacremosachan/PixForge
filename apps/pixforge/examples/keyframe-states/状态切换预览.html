function tick(now){if(running){if(player){player.advance(Math.min(120000,Math.max(0,now-lastAdvance)));lastAdvance=now;sceneAt=player.clock();textureStep();if(player.finished){running=false;$('play').textContent='播放'}if(now-lastTick>=33){lastTick=now;render()}}
 else{let t=now-start;if(data.scene?data.scene.loop:data.plan.loop)t%=total;else if(t>=total){t=total-Number.EPSILON;running=false;$('play').textContent='播放';}if(data.scene){sceneAt=t;textureStep()}else{let n=0;while(n<data.plan.steps.length-1&&t>=data.plan.steps[n].duration_ms)t-=data.plan.steps[n++].duration_ms;step=n}if(now-lastTick>=33){lastTick=now;render()}}}requestAnimationFrame(tick)}
$('play').onclick=()=>{running=!running;$('play').textContent=running?'暂停':'播放';if(player){if(player.finished)player.seek(0);lastAdvance=performance.now();sceneAt=player.clock();textureStep();render()}else seek(data.scene?sceneAt:step)};
if(player){$('stateControls').hidden=false;for(const clip of data.scene.states){const option=document.createElement('option');option.value=clip.id;option.textContent=clip.label;$('state').appendChild(option)}
 $('state').onchange=()=>{running=false;$('play').textContent='播放';player.select($('state').value);sceneAt=0;textureStep();render()};
 const action=event=>{if(event==='demo')player.beginSequence();else player.event(event);sceneAt=player.clock();textureStep();running=true;$('play').textContent='暂停';lastAdvance=performance.now();render()};
 $('stateStart').onclick=()=>action('start');$('stateStop').onclick=()=>action('stop');$('stateDemo').onclick=()=>action('demo');textureStep();
}
for(const id of ['base','collision','selection','model','yaw','pitch'])$(id).oninput=render;
$('frame').max=data.scene?total:data.plan.steps.length-1;$('frame').oninput=()=>{running=false;$('play').textContent='播放';seek(+$('frame').value)};
for(const[id,y,p]of[['iso',35,30],['top',0,90],['front',0,0]])$(id).onclick=()=>{$('yaw').value=y;$('pitch').value=p;render()};
cv.onpointerdown=e=>{drag=[e.clientX,e.clientY,+$('yaw').value,+$('pitch').value];cv.setPointerCapture(e.pointerId)};cv.onpointermove=e=>{if(!drag)return;$('yaw').value=Math.max(-180,Math.min(180,drag[2]+(e.clientX-drag[0])*.5));$('pitch').value=Math.max(-89,Math.min(90,drag[3]-(e.clientY-drag[1])*.5));render()};cv.onpointerup=()=>drag=null;
document.addEventListener('visibilitychange',()=>{if(document.hidden){running=false;$('play').textContent='播放'}});
if(data.scene){$('mode').textContent=`${data.scene.target.loader} / MC ${data.scene.target.minecraft} · 离线场景预览，尚未接入游戏`;document.querySelector('main>p').textContent='部件运动、粒子与材质共用时间轴；拖动旋转视角，拖动时间滑块逐时检查。自定义着色器尚未支持。'}else $('mode').textContent=`碰撞：${data.report.modes.collision==='inherit'?'继承基础':'独立覆盖'}；选中：${data.report.modes.selection==='inherit'?'继承基础':'独立覆盖'}`;
$('projectTitle').textContent='模型与形状 · '+(data.metadata.project_name||'未命名工程');document.title='PixForge · '+(data.metadata.project_name||'形状预览');
$('summary').textContent=JSON.stringify(data.report,null,2);$('boxes').textContent=JSON.stringify(data.shapes,null,2);$('identity').textContent=`文档 ${data.metadata.document_id}\n版本 ${data.metadata.revision}\n摘要 ${data.metadata.content_digest}\n待查看和确认`;
Promise.all(data.images.map(src=>new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=im.width;c.height=im.height;const cx=c.getContext('2d');cx.drawImage(im,0,0);resolve(cx.getImageData(0,0,im.width,im.height))};im.onerror=reject;im.src=src}))).then(result=>{frames=result;render();requestAnimationFrame(tick)}).catch(e=>{$('projectTitle').textContent='模型与形状 · '+(data.metadata.project_name||'未命名工程');document.title='PixForge · '+(data.metadata.project_name||'形状预览');
$('summary').textContent=String(e)});
</script></html>
